
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logowanie - SecureNotes</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <h1 class="logo">SecureNotes</h1>

            <p class="header-description">
                Twoje bezpieczne notatki
            </p>
        </div>
    </header>

    <main class="main-container">
        <section class="card">
            <h2>Zaloguj się</h2>

            <p class="description">
                Wprowadź dane swojego konta,
                aby uzyskać dostęp do notatek.
            </p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">
                        Adres e-mail
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           autocomplete="username"
                           maxlength="254"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Hasło
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-full">
                    Zaloguj się
                </button>

                <p id="form-message"
                   class="form-message"
                   role="status"
                   aria-live="polite"></p>
            </form>

            <p class="text-center description">
                Nie masz konta?
                <a href="/register.html">
                    Zarejestruj się
                </a>
            </p>

            <p class="text-center">
                <a href="/">Powrót do strony głównej</a>
            </p>
        </section>
    </main>

    <script type="module" src="/js/auth.js"></script>

</body>
</html>
