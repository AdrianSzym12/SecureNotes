
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rejestracja - SecureNotes</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">

    <header class="site-header">
        <div class="header-content">

            <a href="/" class="notes-brand">
                <span class="brand-symbol">S</span>

                <span class="brand-text">
                    <strong>SecureNotes</strong>
                    <small>Twoja prywatna przestrzeń</small>
                </span>
            </a>

            <a href="/" class="notes-back-link">
                ← Strona główna
            </a>

        </div>
    </header>

    <main class="auth-container">

        <section class="card auth-card">

            <div class="auth-heading">
                <span class="notes-eyebrow">
                    DOŁĄCZ DO SECURENOTES
                </span>

                <h1>Utwórz konto</h1>

                <p class="description">
                    Zarejestruj się, aby bezpiecznie
                    przechowywać i organizować swoje notatki.
                </p>
            </div>

            <form id="register-form">

                <div class="form-group">
                    <label for="email">
                        Adres e-mail
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="twoj@email.pl"
                           autocomplete="username"
                           maxlength="254"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Hasło
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Minimum 12 znaków"
                           autocomplete="new-password"
                           minlength="12"
                           maxlength="128"
                           required>

                    <small class="auth-field-hint">
                        Hasło musi zawierać od 12 do 128 znaków.
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        Powtórz hasło
                    </label>

                    <input type="password"
                           id="confirm-password"
                           name="confirm-password"
                           placeholder="Wpisz hasło ponownie"
                           autocomplete="new-password"
                           minlength="12"
                           maxlength="128"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-full">
                    Utwórz konto →
                </button>

                <p id="form-message"
                   class="form-message"
                   role="status"
                   aria-live="polite"></p>

            </form>

            <div class="auth-bottom">
                <p>
                    Masz już konto?
                    <a href="/login.html">
                        Zaloguj się
                    </a>
                </p>
            </div>

        </section>

        <p class="auth-caption">
            SecureNotes · Twoje notatki, Twoja prywatność
        </p>

    </main>

    <script type="module" src="/js/auth.js"></script>

</body>
</html>
